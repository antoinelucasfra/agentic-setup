name: CI

on:
  push:
    branches: [ master, feat/* ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck setup.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: bash setup.sh --dry-run
      - run: |
          test -f .agents/AGENTS.md
          test -d .agents/skills
          test -d .agents/rules
          test -f README.md
          test -f docs/SETUP.md
      - run: |
          echo "Skills: $(find .agents/skills -name SKILL.md | wc -l)"
          echo "Rules: $(find .agents/rules -name '*.md' | wc -l)"
          echo "Docs: $(find docs -name '*.md' | wc -l)"
