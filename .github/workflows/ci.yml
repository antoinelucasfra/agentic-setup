name: CI

on:
  push:
    branches: [ master, feat/* ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          shellcheck setup.sh
          shellcheck scripts/validate.sh
      - name: Check markdown
        run: |
          find . -name "*.md" -type f | head -20

  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v3
      - name: Test dry-run
        run: |
          bash setup.sh --dry-run
      - name: Validate structure
        run: |
          test -f .agents/AGENTS.md
          test -d .agents/skills
          test -d .agents/rules
          test -f scripts/validate.sh
          test -f README.md
          test -f docs/SETUP.md
          test -f docs/CONTRIBUTING.md

  count-skills:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v3
      - name: Count skills
        run: |
          echo "Skills count: $(find .agents/skills -name SKILL.md | wc -l)"
          echo "Rules count: $(ls .agents/rules/*.md 2>/dev/null | wc -l)"

  summary:
    runs-on: ubuntu-latest
    needs: [validate, count-skills]
    steps:
      - name: Summary
        run: |
          echo "✅ Repository validation complete"
          echo "📁 Skills: $(find .agents/skills -name SKILL.md | wc -l)"
          echo "📜 Rules: $(ls .agents/rules/*.md 2>/dev/null | wc -l)"
          echo "📝 Docs: $(ls docs/*.md 2>/dev/null | wc -l)"